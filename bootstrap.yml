---
- hosts: all
  become: true
  tasks:

  - name: Install Updates (Rocky)
    dnf:
      update_only: yes
      update_cache: yes
    when: ansible_distribution == "Rocky"

  - name: Install Updates (Ubuntu)
    apt:
      upgrade: dist
      update_cache: yes
    when: ansible_distribution == "Ubuntu"

- hosts: all
  become: true
  tasks:

  - name: Create Ansible User
    user:
      name: ansible

  - name: Add SSH key for Ansible User
    authorized_key:
      user: ansible
      key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFAJI/H7P1eVjhuvcGvGFV4MlR6PNkJQozAfs+lDEY94 ansible"
"

  - name: Add sudoers file for Ansible
    copy:
      src: sudoers_ansible
      dest: /etc/sudoers.d/ansible
      owner: root
      group: root
      mode: 0440
