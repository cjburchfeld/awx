---
- hosts: all
  become: true
  tasks:

  - name: Install Updates (Debian-based)
    ansible.builtin.apt:
      upgrade: yes
      update_cache: yes
    when: ansible_facts['os_family'] == "Debian"

  - name: Install Updates (Redhat-based)
    ansible.builtin.dnf:
      name: "*"
      state: latest
      update_cache: true
    when: ansible_facts['os_family'] == "RedHat"
